[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellsig"
version = "1.0.0"
description = "Li-ion cell signal diagnostics and outlier-rejection criteria, validated by fault injection on real NASA and CALCE telemetry"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "duckdb>=1.0", "pyarrow", "openpyxl", "pyyaml", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
cellsig = "cellsig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
